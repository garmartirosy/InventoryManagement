# Docs for the Azure Web Apps Deploy action
# https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.NET Core app to Azure Web App - InventoryManagementPLA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore web application
        run: dotnet restore InventoryManagement/InventoryManagement.csproj

      - name: Build web application
        run: >
          dotnet build
          InventoryManagement/InventoryManagement.csproj
          --configuration Release
          --no-restore

      - name: Publish web application
        run: >
          dotnet publish
          InventoryManagement/InventoryManagement.csproj
          --configuration Release
          --no-build
          --output ./published

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./published

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./published

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_42A5882F67BB4201AC1B4EA9AF8383AD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F072AF0DA066485E841783998E9D50D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1A21EA37349F4A2CA96771322B442C9E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: InventoryManagementPLA
          slot-name: Production
          package: ./published
